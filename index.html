<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign Up</title>
</head>
<body>
    <div id="container">
        <div id="imageLeft">
            <img src="plant.jpg" alt="an image of a fern" id="plant">
            <div id="logoBand">
                <span id="logoText">ODIN</span>
            </div>
        </div>
        <div id="rightContainer">
            <div id="upper">
                <p>
                    This is not a real online service! You know you need
                    something like this in your life to help you realize
                    your deepest dreams.
                </p>
                <p>Sign up <em>now</em> to get started.</p>
                <p>You <em>know</em> you want to.</p>
            </div>
            <div id="middle">
                <p id="formTitle">Let's do this!</p>
                <form id="signupForm" action="#" method="post">
                    <div class="formRow">
                        <div class="formField">
                            <label for="firstName">FIRST NAME</label>
                            <input type="text" id="firstName" name="first_name" required>
                        </div>
                        <div class="formField">
                            <label for="lastName">LAST NAME</label>
                            <input type="text" id="lastName" name="last_name" required>
                        </div>
                    </div>
                    <div class="formRow">
                        <div class="formField">
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="formField">
                            <label for="phone">PHONE NUMBER</label>
                            <input type="tel" id="phone" name="phone">
                        </div>
                    </div>
                    <div class="formRow">
                        <div class="formField">
                            <label for="password">PASSWORD</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <div class="formField">
                            <label for="confirmPassword">CONFIRM PASSWORD</label>
                            <input type="password" id="confirmPassword" name="confirm_password" required>
                        </div>
                    </div>
                </form>
            </div>
            <div id="bottom">
                <button type="submit" form="signupForm" id="createAccount">Create Account</button>
                <p id="loginLine">Already have an account? <a href="#">Log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
